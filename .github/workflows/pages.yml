name: Publish ONVIF Spec Review

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: spec-review-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'videoai/spec-review' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout trusted viewer code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Checkout public specifications as data
        uses: actions/checkout@v6
        with:
          repository: onvif/specs
          ref: development
          path: _source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test viewer
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          XML_REVIEW_REPO: ${{ github.workspace }}/_source
          XML_REVIEW_TEST_REPO: ${{ github.workspace }}/_source
        run: |
          python3 -m unittest -q
          node test_frontend.cjs
          node test_static_frontend.cjs
      - name: Build public PR comparisons
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 build_site.py --repo _source --fetch --output _site
      - name: Upload downloadable preview
        uses: actions/upload-artifact@v4
        with:
          name: spec-review-static-preview
          path: _site
          include-hidden-files: true
          retention-days: 3
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
